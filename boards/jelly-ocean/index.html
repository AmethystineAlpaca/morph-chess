<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jelly Ocean</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="data:,"></head><body><main id="app"><canvas id="scene" aria-label="Interactive 3D liquid chessboard"></canvas><aside aria-label="Board settings" hidden><div class="eyebrow">Color</div><div class="swatches"><button class="swatch active" data-theme="amber" aria-label="Amber Gold" title="Amber Gold" style="--color:#e9a020"></button><button class="swatch" data-theme="jade" aria-label="Seafoam Green" title="Seafoam Green" style="--color:#58b8a7"></button><button class="swatch" data-theme="rose" aria-label="Rose Pink" title="Rose Pink" style="--color:#cb7792"></button></div><details class="advanced-settings"><summary>Appearance</summary><label for="strength">Flow intensity <output id="strength-value">10%</output><input id="strength" type="range" min="0" max="100" value="10"></label><label for="bounce">Elasticity <output id="bounce-value">1%</output><input id="bounce" type="range" min="0" max="100" value="1"></label><label for="grid-transparency">Square transparency <output id="grid-transparency-value">85%</output><input id="grid-transparency" type="range" min="0" max="100" value="85"></label><label class="toggle"><input id="grid" type="checkbox" checked> Show squares</label><div class="settings-row"><button id="reset" title="Restore default settings and starting view">Reset defaults</button></div></details><div class="settings-row"><button id="pause">Pause animation</button></div><nav class="settings-links"><a href="%BASE_URL%?board=jelly-ocean">Free Play</a><a href="%BASE_URL%pieces/ruby/">View pieces</a></nav></aside><footer><span>Click to press · Drag to rotate · Scroll to zoom</span></footer><div id="error" hidden></div></main><script type="module" src="./preview.js"></script></body></html>
